name: CS Launcher V3 CI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Restore FirebaseSyncManager (good revision)
        run: |
          set -euo pipefail
          TARGET="app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/remote/FirebaseSyncManager.java"
          # Known-good blob before accidental truncate
          URL="https://raw.githubusercontent.com/anjalifredy-ai/CS-LAUNCHER-v3/2206a14923f396928b357ad22ddc9661f8a40d64/${TARGET}"
          curl -fsSL "$URL" -o "$TARGET"
          # Remove missing R.id that broke release compile
          sed -i '/infrawire_card_feed/d' "$TARGET"
          wc -l "$TARGET"
          grep -n "infrawire_card" "$TARGET" || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download JRE 8 (attempt 1)
        id: download_jre8_primary
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: success
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Download JRE 8 (retry after timeout)
        if: steps.download_jre8_primary.outcome == 'failure'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: success
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        with:
          validate-wrappers: false
          gradle-version: "8.11"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Decode signing keystore (or use default embedded release keystore)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > keystore.jks
            echo "KEYSTORE_PATH=${{ github.workspace }}/keystore.jks" >> $GITHUB_ENV
            echo "KEY_ALIAS=${SIGNING_KEY_ALIAS}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${SIGNING_KEY_PASSWORD}" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${SIGNING_STORE_PASSWORD}" >> $GITHUB_ENV
            echo "Keystore decoded successfully."
          else
            echo "KEYSTORE_PATH=${{ github.workspace }}/app_pojavlauncher/release.keystore" >> $GITHUB_ENV
            echo "KEY_ALIAS=cslauncher" >> $GITHUB_ENV
            echo "KEY_PASSWORD=cslauncher2026" >> $GITHUB_ENV
            echo "STORE_PASSWORD=cslauncher2026" >> $GITHUB_ENV
            echo "Using default release keystore"
          fi

      - name: Update language list
        run: |
          chmod +x ./scripts/languagelist_updater.sh || true
          if [ -f ./scripts/languagelist_updater.sh ]; then
            ./scripts/languagelist_updater.sh || true
          fi
          mkdir -p out

      - name: Build Release APK
        run: |
          set -euo pipefail
          SIGNING_ARGS=""
          if [ -n "${KEYSTORE_PATH:-}" ]; then
            SIGNING_ARGS="-PsigningKeystore=$KEYSTORE_PATH \
                          -PsigningKeyAlias=$KEY_ALIAS \
                          -PsigningKeyPassword=$KEY_PASSWORD \
                          -PsigningStorePassword=$STORE_PASSWORD"
          fi
          ./gradlew :app_pojavlauncher:assembleRelease $SIGNING_ARGS \
            -Pandroid.enableR8.fullMode=true \
            --no-daemon \
            --stacktrace

          echo "=== APK outputs ==="
          find app_pojavlauncher/build/outputs -type f -name "*.apk" -print || true

          RELEASE_APK=""
          if [ -d app_pojavlauncher/build/outputs/apk/release ]; then
            RELEASE_APK=$(find app_pojavlauncher/build/outputs/apk/release -type f -name "*.apk" ! -name "*unsigned*" | head -n 1 || true)
            if [ -z "$RELEASE_APK" ]; then
              RELEASE_APK=$(find app_pojavlauncher/build/outputs/apk/release -type f -name "*.apk" | head -n 1 || true)
            fi
          fi
          if [ -z "$RELEASE_APK" ]; then
            RELEASE_APK=$(find app_pojavlauncher/build/outputs -type f -name "*release*.apk" | head -n 1 || true)
          fi
          if [ -z "$RELEASE_APK" ]; then
            RELEASE_APK=$(find app_pojavlauncher/build/outputs -type f -name "*.apk" | head -n 1 || true)
          fi

          if [ -z "$RELEASE_APK" ] || [ ! -f "$RELEASE_APK" ]; then
            echo "ERROR: No APK produced"
            exit 1
          fi

          mkdir -p out
          cp -f "$RELEASE_APK" out/CS-LAUNCHER-V3.apk
          md5sum out/CS-LAUNCHER-V3.apk > out/CS-LAUNCHER-V3.md5
          sha256sum out/CS-LAUNCHER-V3.apk > out/CS-LAUNCHER-V3.sha256
          ls -lah out/

      - name: Verify Signed APK
        run: |
          set -euo pipefail
          test -f out/CS-LAUNCHER-V3.apk
          ls -lh out/CS-LAUNCHER-V3.apk
          jarsigner -verify -verbose -certs out/CS-LAUNCHER-V3.apk | head -n 25 || true

      - name: APK size report
        run: |
          SIZE=$(du -sh out/CS-LAUNCHER-V3.apk | cut -f1)
          echo "## APK Size" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| CS-LAUNCHER-V3.apk | $SIZE |" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS-LAUNCHER-V3
          path: |
            out/CS-LAUNCHER-V3.apk
            out/CS-LAUNCHER-V3.md5
            out/CS-LAUNCHER-V3.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        if: success()
        with:
          artifacts: "out/CS-LAUNCHER-V3.apk,out/CS-LAUNCHER-V3.md5,out/CS-LAUNCHER-V3.sha256"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v3"
          name: "CS Launcher V3 / RemomLauncher"
          body: |
            ## CS Launcher V3 / RemomLauncher
            **Download:** `CS-LAUNCHER-V3.apk`
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          replacesArtifacts: true
