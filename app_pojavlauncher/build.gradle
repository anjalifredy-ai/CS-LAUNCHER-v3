plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

static def getDate() { return new Date().format('yyyyMMdd') }

def getVersionName = {
    // RemomLauncher version display
    String semVer = "0.2.0"

    ByteArrayOutputStream TAG = new ByteArrayOutputStream()
    exec {
        try {
            commandLine 'git', 'describe', '--tags'
            ignoreExitValue true
            standardOutput = TAG
        } catch (Exception e) {
            e.printStackTrace();
        }
    }

    String tagStr = TAG.toString().trim()
    if (!tagStr.isEmpty()) {
        if (tagStr ==~ /^v?\d+(?:\.\d+)*.*/) {
            return tagStr
        }
    }

    return "v" + semVer
}

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY");
    if(key != null) return key;
    File curseforgeKeyFile = new File("$projectDir/curseforge_key.txt");
    if(curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        return curseforgeKeyFile.text;
    }
    logger.warn('BUILD: You have no CurseForge key, the curseforge api will get disabled !');
    return "DUMMY";
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace 'net.kdt.pojavlaunch'

    compileSdk = 34

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    signingConfigs {
        customDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (project.hasProperty("signingKeystore") && new File(project.property("signingKeystore")).exists()) {
                storeFile file(project.property("signingKeystore"))
                storePassword project.property("signingStorePassword")
                keyAlias project.property("signingKeyAlias")
                keyPassword project.property("signingKeyPassword")
            } else {
                storeFile file("release.keystore")
                storePassword "cslauncher2026"
                keyAlias "cslauncher"
                keyPassword "cslauncher2026"
            }
        }
    }

    defaultConfig {
        // Keep package for upgrade path from CS builds; change only if you want a fresh install ID
        applicationId "com.craftstudio.cslauncherv3"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 10020000
        versionName getVersionName()
        multiDexEnabled true
        resValue 'string', 'curseforge_api_key', getCFApiKey()
        externalNativeBuild {
            ndkBuild {
                arguments "APP_SHORT_COMMANDS=true"
            }
        }

        if (!(project.findProperty("keepX86") ?: "false").toBoolean()) {
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customDebug
            resValue "string", "app_name", "RemomLauncher"
            resValue "string", "app_short_name", "Remom"
            resValue 'string', 'application_package', 'com.craftstudio.cslauncherv3.debug'
            resValue 'string', 'storageProviderAuthorities', 'com.craftstudio.cslauncherv3.scoped.gamefolder.debug'
            resValue 'string', 'shareProviderAuthority', 'com.craftstudio.cslauncherv3.scoped.controlfolder.debug'
        }
        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
        }
        proguardNoDebug {
            initWith proguard
            debuggable false
        }

        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            resValue "string", "app_name", "RemomLauncher"
            resValue "string", "app_short_name", "Remom"
            resValue 'string', 'storageProviderAuthorities', 'com.craftstudio.cslauncherv3.gamefolder'
            resValue 'string', 'application_package', 'com.craftstudio.cslauncherv3'
        }
        gplay {
            initWith release
            matchingFallbacks = [ 'release' ]
        }
    }

    ndkVersion = "27.3.13750724"

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        doNotStrip += [
                "**/libcutils.so"
        ]
        pickFirst '**/libbytehook.so'
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    buildToolsVersion = '34.0.0'
}

afterEvaluate {
    tasks.mergeDebugAssets.dependsOn(":forge_installer:jar", ":arc_dns_injector:jar", ":methods_injector_agent:jar", ":jre_lwjgl3glfw:jar")
    tasks.mergeReleaseAssets.dependsOn(":forge_installer:jar", ":arc_dns_injector:jar", ":methods_injector_agent:jar", ":jre_lwjgl3glfw:jar")
}

